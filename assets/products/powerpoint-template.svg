<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="760" height="620" role="img" aria-label="PowerPoint Template Bundles">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fffdf9"/><stop offset="1" stop-color="#efe6d7"/></linearGradient>
  <linearGradient id="f" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#5c584a"/><stop offset="1" stop-color="#4a4636"/></linearGradient>
  <linearGradient id="s" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2b291f"/><stop offset="1" stop-color="#2b291f"/></linearGradient>
  <linearGradient id="t" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#87847a"/><stop offset="1" stop-color="#666356"/></linearGradient>
  <linearGradient id="gloss" x1="0" y1="0" x2=".8" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".20"/>
    <stop offset=".38" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="refl" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4a4636" stop-opacity=".26"/>
    <stop offset="1" stop-color="#4a4636" stop-opacity="0"/></linearGradient>
  <radialGradient id="sh">
    <stop offset="0" stop-color="#3a2a1c" stop-opacity=".40"/>
    <stop offset="1" stop-color="#3a2a1c" stop-opacity="0"/></radialGradient>
</defs>

<rect width="760" height="620" fill="url(#bg)"/>
<circle cx="640" cy="86" r="150" fill="#d8ae6c" opacity=".10"/>

<!-- mirrored reflection under the box, fading out -->
<g transform="translate(0,1044) scale(1,-1)" opacity=".5">
  <rect x="196" y="92" width="330" height="430" fill="url(#refl)"/>
</g>
<ellipse cx="381.0" cy="538" rx="218" ry="22" fill="url(#sh)"/>

<path d="M196 92 L258 50 L588 50 L526 92 Z" fill="url(#t)"/>
<path d="M526 92 L588 50 L588 480 L526 522 Z" fill="url(#s)"/>
<rect x="196" y="92" width="330" height="430" fill="url(#f)"/>
<rect x="196" y="92" width="330" height="430" fill="url(#gloss)"/>
<rect x="524" y="92" width="2" height="430" fill="#fff" opacity=".18"/>

<!-- front face -->
<rect x="226" y="136" width="46" height="3" fill="#d8ae6c"/>
<text x="226" y="176" font-size="16" fill="#d8ae6c"
      font-family="Helvetica,Arial,sans-serif" font-weight="700" letter-spacing="2.6">200,000+</text>
<text x="226" y="260" font-size="37" fill="#fbf8f2" font-family="Georgia,serif" font-weight="700">PowerPoint</text><text x="226" y="306" font-size="37" fill="#fbf8f2" font-family="Georgia,serif" font-weight="700">Template</text><text x="226" y="352" font-size="37" fill="#fbf8f2" font-family="Georgia,serif" font-weight="700">Bundles</text>
<line x1="226" y1="448" x2="496" y2="448" stroke="#fbf8f2" stroke-opacity=".22"/>
<text x="226" y="480" font-size="17" fill="#fbf8f2" opacity=".78"
      font-family="Georgia,serif">Exhale<tspan fill="#d8ae6c">PLR</tspan></text>
</svg>